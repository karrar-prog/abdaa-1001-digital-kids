  <circle cx="100" cy="100" r="90" fill="#0c4a6e" fill-opacity="0.25" stroke="url(#primaryGrad)" stroke-width="4" stroke-dasharray="12 6" />
  
  <!-- Modern Geometric Cube / Smart Brain -->
  <polygon points="100,35 155,67 100,99 45,67" fill="url(#primaryGrad)" />
  <polygon points="45,67 100,99 100,165 45,133" fill="#0369a1" />
  <polygon points="155,67 100,99 100,165 155,133" fill="#0284c7" />
  
