  <circle cx="45" cy="67" r="6" fill="#22d3ee" />
  <circle cx="155" cy="67" r="6" fill="#22d3ee" />
  <circle cx="100" cy="35" r="6" fill="url(#accentGrad)" />
  <circle cx="100" cy="165" r="6" fill="url(#accentGrad)" />
  
  <!-- Graduation Sparkle -->
  <path d="M100 20 L104 28 L112 32 L104 36 L100 44 L96 36 L88 32 L96 28 Z" fill="url(#accentGrad)" />
